<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel - Pazaryeri SaaS</title>
<style>
*{box-sizing:border-box}body{font-family:Inter,sans-serif;background:#f6f7f9;margin:0}
header{background:#111;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.wrap{padding:22px;max-width:1200px;margin:0 auto;display:grid;gap:18px}
.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.05);border:1px solid #eee}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.market{border:1.5px solid #eee;border-radius:14px;padding:14px;position:relative;transition:.2s}
.market.bagli{border-color:#111;background:#fafafa}
.badge{padding:4px 9px;background:#111;color:#fff;border-radius:20px;font-size:11px;font-weight:700}
.badge.green{background:#16a34a}.badge.yellow{background:#eab308}.badge.red{background:#ef4444}
.badge.gray{background:#e5e7eb;color:#555}
input,select{width:100%;padding:11px 12px;margin:6px 0;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px}
button{padding:10px 18px;background:#111;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px}
.trial-banner{padding:14px 18px;border-radius:12px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.trial-green{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.trial-yellow{background:#fef9c3;color:#854d0e;border:1px solid #fde68a}
.trial-red{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
</style>
</head>
<body>
<header>
<div id="shop" style="font-weight:800">Yükleniyor...</div>
<div style="display:flex;gap:8px;align-items:center"><span id="trialBadge" class="badge"></span><button onclick="localStorage.removeItem('token');location.href='/login.html'" style="background:#fff;color:#111;border:1px solid #ddd;border-radius:8px;padding:6px 12px">Çıkış</button></div>
</header>

<div class="wrap">

<div id="trialBanner" class="trial-banner" style="display:none"></div>

<div class="grid3">
<div class="card"><div style="color:#666;font-size:11px">TOPLAM STOK</div><div id="totalStock" style="font-size:26px;font-weight:900">-</div></div>
<div class="card"><div style="color:#666;font-size:11px">BAĞLI PAZARYERİ</div><div id="totalMp" style="font-size:26px;font-weight:900">-</div></div>
<div class="card"><div style="color:#666;font-size:11px">KALAN DENEME</div><div id="trialDays" style="font-size:26px;font-weight:900">-</div></div>
</div>

<div class="card">
<h2 style="margin:0">🛒 Pazaryeri Bağlantılarım</h2>
<div class="grid4" id="connList" style="margin-top:14px"></div>
<div style="margin-top:18px;border-top:1px solid #eee;padding-top:16px">
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
<div style="flex:1;min-width:140px"><label>Pazaryeri</label><select id="mp" onchange="updateForm()"></select></div>
<div style="flex:1;min-width:120px" id="f-supplier"><label>Supplier ID</label><input id="supplierId" placeholder="123456"></div>
<div style="flex:1;min-width:120px" id="f-store"><label>Mağaza URL</label><input id="storeUrl" placeholder="magaza.myshopify.com"></div>
<div style="flex:1;min-width:120px"><label>API Key</label><input id="key" placeholder="API Key"></div>
<div style="flex:1;min-width:120px"><label>API Secret</label><input id="secret" placeholder="Secret"></div>
<div><button onclick="connectMp()" style="height:42px">Bağla →</button></div>
</div>
<div id="connMsg" style="margin-top:10px;font-size:13px;padding:10px;border-radius:8px;display:none"></div>
</div>
</div>

<div class="card"><h2>📦 Ürünlerim</h2><table id="p"><thead><tr><th>Barkod</th><th>Ürün</th><th>Yerler</th><th>Stok</th><th>İşlem</th></tr></thead><tbody></tbody></table></div>
</div>

<script>
const token=localStorage.getItem('token');
if(!token) location.href='/login.html';
function authFetch(u,o={}){ o.headers={...o.headers, Authorization:'Bearer '+token, 'Content-Type':'application/json'}; return fetch(u,o); }
let ALL_MP=[];
async function init(){
  const mpRes=await fetch('/api/marketplaces'); const mpData=await mpRes.json(); ALL_MP=mpData.data;
  document.getElementById('mp').innerHTML=ALL_MP.map(m=>`<option value="${m.name}">${m.icon} ${m.name}</option>`).join('');
  updateForm(); load();
}
function updateForm(){
  const mp=ALL_MP.find(x=>x.name===document.getElementById('mp').value);
  if(!mp) return;
  document.getElementById('f-supplier').style.display=(mp.fields.includes('supplierId')||mp.fields.includes('sellerId'))?'block':'none';
  document.getElementById('f-store').style.display=mp.fields.includes('storeUrl')?'block':'none';
}
async function load(){
  try{
    const payload=JSON.parse(atob(token.split('.')[1]));
    document.getElementById('shop').innerText=payload.shopName+' Panel';
    const tRes=await authFetch('/api/me/trial');
    if(tRes.status===403){
      const err=await tRes.json();
      document.body.innerHTML=`<div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#f6f7f9"><div style="background:#fff;padding:40px;border-radius:20px;text-align:center;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.1)"><div style="font-size:48px">⛔</div><h2>Deneme süreniz bitti</h2><p style="color:#666;margin:12px 0">Mağazanız durduruldu. Devam etmek için abonelik alın.</p><p style="font-size:12px;color:#888">Bitiş: ${new Date(err.trialInfo.endsAt).toLocaleDateString('tr-TR')}</p><a href="mailto:destek@pazaryerios.com" style="display:inline-block;margin-top:16px;background:#111;color:#fff;padding:12px 24px;border-radius:100px;text-decoration:none;font-weight:700">Destek ile İletişime Geç</a><br><button onclick="localStorage.clear();location.href='/login.html'" style="margin-top:12px;background:#fff;border:1px solid #ddd">Çıkış Yap</button></div></div>`;
      return;
    }
    const tData=await tRes.json();
    const trial=tData.data;
    document.getElementById('trialDays').innerText=trial.diffDays+' gün';
    const badge=document.getElementById('trialBadge');
    const banner=document.getElementById('trialBanner');
    if(trial.diffDays<=3){
      badge.className='badge red'; badge.innerText='⚠️ '+trial.diffDays+' gün kaldı';
      banner.className='trial-banner trial-red'; banner.style.display='flex';
      banner.innerHTML=`<span>🚨 Deneme süreniz ${trial.diffDays} gün sonra bitiyor! Mağazanız kapanacak.</span><a href="mailto:destek@pazaryerios.com" style="background:#991b1b;color:#fff;padding:6px 12px;border-radius:20px;text-decoration:none;font-size:12px">Paket Al</a>`;
    } else if(trial.diffDays<=7){
      badge.className='badge yellow'; badge.innerText=trial.diffDays+' gün kaldı';
      banner.className='trial-banner trial-yellow'; banner.style.display='flex';
      banner.innerHTML=`<span>⏰ Deneme süreniz ${trial.diffDays} gün sonra bitiyor.</span><span style="font-size:11px">${new Date(trial.endsAt).toLocaleDateString('tr-TR')} tarihine kadar</span>`;
    } else {
      badge.className='badge green'; badge.innerText=trial.diffDays+' gün';
      banner.className='trial-banner trial-green'; banner.style.display='flex';
      banner.innerHTML=`<span>✅ Deneme süreniz aktif - ${trial.diffDays} gün kaldı</span><span style="font-size:11px">Bitiş: ${new Date(trial.endsAt).toLocaleDateString('tr-TR')}</span>`;
    }

    const conns=await (await authFetch('/api/connections')).json();
    const prods=await (await authFetch('/api/products')).json();
    document.getElementById('totalMp').innerText=conns.data.length;
    document.getElementById('totalStock').innerText=prods.data.reduce((a,b)=>a+b.stock,0);
    document.getElementById('connList').innerHTML=ALL_MP.map(m=>{
      const c=conns.data.find(x=>x.marketplace===m.name);
      return `<div class="market ${c?'bagli':''}"><div style="display:flex;justify-content:space-between"><b>${m.icon} ${m.name}</b>${c?'<span class="badge green">Aktif</span>':'<span class="badge gray">Kapalı</span>'}</div><div style="margin:8px 0;font-size:11px;color:#666">${c? 'Bağlı - '+c.connectedAt : m.desc}</div>${c?`<button onclick="disconnectMp('${m.name}')" style="padding:5px 10px;font-size:11px;background:#fff;color:#ef4444;border:1px solid #fee2e2">Kes</button>`:''}</div>`;
    }).join('');
    document.querySelector('#p tbody').innerHTML=prods.data.map(x=>`<tr><td>${x.barcode}</td><td>${x.title}</td><td>${x.marketplaces.join(', ')}</td><td style="font-weight:800">${x.stock}</td><td><button onclick="sell('${x.barcode}')" style="padding:6px 10px;font-size:11px">Satış Simule</button></td></tr>`).join('');
  }catch(e){ console.error(e); }
}
async function connectMp(){
  const marketplace=document.getElementById('mp').value, apiKey=document.getElementById('key').value, apiSecret=document.getElementById('secret').value, supplierId=document.getElementById('supplierId').value, storeUrl=document.getElementById('storeUrl').value;
  const msg=document.getElementById('connMsg'); msg.style.display='block'; msg.innerText='Bağlanıyor...'; msg.style.background='#f3f4f6';
  try{
    const res=await authFetch('/api/connections',{method:'POST',body:JSON.stringify({marketplace,apiKey,apiSecret,supplierId,storeUrl})});
    const data=await res.json();
    if(data.trialExpired){ location.reload(); return; }
    msg.innerText=data.message||'Bağlandı!'; msg.style.background='#dcfce7'; load();
  }catch(e){ msg.innerText=e.message; msg.style.background='#fee2e2'; }
}
async function disconnectMp(name){ if(!confirm(name+' kesilsin mi?')) return; await authFetch('/api/connections/'+encodeURIComponent(name),{method:'DELETE'}); load(); }
async function sell(b){ await authFetch('/api/orders/mock-sell',{method:'POST',body:JSON.stringify({barcode:b})}); load(); }
init();
</script>
</body>
</html>
