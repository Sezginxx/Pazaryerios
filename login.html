<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PazaryeriOS - Giriş Yap</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#fcfcfc;display:flex;min-height:100vh}.left{flex:1;background:#0f0f0f;color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:space-between}.right{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}.logo{font-weight:900;font-size:22px}.logo span{font-weight:400;color:#888}.quote{font-size:32px;font-weight:700;letter-spacing:-1.5px;line-height:1.1}.card{background:#fff;border:1px solid #eee;border-radius:20px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.06)}h2{font-size:26px;font-weight:800;letter-spacing:-1px;margin-bottom:8px}p.sub{color:#888;font-size:14px;margin-bottom:28px}label{font-size:13px;font-weight:600;display:block;margin:14px 0 6px}input{width:100%;padding:12px 14px;border:1px solid #e5e5e5;border-radius:10px;font-size:14px}input:focus{outline:none;border-color:#0f0f0f}button{width:100%;margin-top:20px;padding:12px;background:#0f0f0f;color:#fff;border:none;border-radius:100px;font-weight:600;cursor:pointer;font-size:14px}button:hover{background:#222}.link{margin-top:16px;text-align:center;font-size:13px}.link a{color:#0f0f0f;font-weight:600;text-decoration:none}
@media(max-width:800px){.left{display:none}.right{padding:20px}}
</style>
</head>
<body>
<div class="left">
<div class="logo">pazaryeriOS<span>.io</span></div>
<div>
<div class="quote">"1 ürün sattım,<br>3 pazaryerinde<br>stoğum düştü. Bitti."</div>
<div style="margin-top:20px;color:#888">— Aktif satıcı, Trendyol'da 2.400 sipariş</div>
</div>
<div style="color:#555;font-size:12px">© 2026 pazaryeriOS - Kapaklı'da yapıldı</div>
</div>
<div class="right">
<div class="card">
<h2>Giriş yap</h2>
<p class="sub">Paneline devam et</p>
<label>Email</label><input id="email" type="email" placeholder="sen@magazan.com">
<label>Şifre</label><input id="pass" type="password" placeholder="••••••••">
<button onclick="login()">Giriş Yap</button>
<div class="link">Hesabın yok mu? <a href="/register.html">Ücretsiz dene</a></div>
<div class="link"><a href="/" style="color:#888">← Anasayfaya dön</a></div>
<div id="msg" style="margin-top:12px;font-size:13px;color:red"></div>
</div>
</div>
<script>
async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('pass').value.trim();
  const msg=document.getElementById('msg');
  if(!email||!password){msg.innerText='Doldur';return;}
  msg.innerText='Giris yapiliyor...';msg.style.color='#666';
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(!data.success){msg.innerText=data.error;msg.style.color='red';return;}
    localStorage.setItem('token',data.token);
    location.href='/dashboard.html';
  }catch(e){msg.innerText=e.message;}
}
</script>
</body>
</html>
